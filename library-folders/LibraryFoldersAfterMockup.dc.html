<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library Folders — After (mockup) — Avia Eyal</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</helmet>
<div style="width:1000px;height:640px;position:relative;background:#f6f7f8;font-family:'Instrument Sans',system-ui,sans-serif;overflow:hidden;user-select:none;display:flex">

  <!-- Side nav sliver -->
  <div style="width:52px;flex:none;background:#131416;display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:18px">
    <span style="width:22px;height:22px;border-radius:6px;background:#fff;display:inline-block"></span>
    <span style="color:#63666e;font-size:15px">🏠</span><span style="color:#63666e;font-size:15px">💼</span><span style="color:#63666e;font-size:15px">👤</span><span style="color:#63666e;font-size:15px">📅</span>
    <span style="color:#fff;font-size:15px;background:#2a2c31;padding:8px;border-radius:8px">▤</span>
    <span style="color:#63666e;font-size:15px">$</span>
  </div>

  <div style="flex:1;padding:26px 34px;overflow:hidden">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:22px">
      <span style="font:700 22px/1 'Instrument Sans';color:#131416">Library</span>
      <span style="font:600 12px/1 'Instrument Sans';color:#fff;background:#131416;padding:9px 18px;border-radius:7px">Upload</span>
    </div>

    <div style="display:flex;gap:28px">
      <!-- Folders sidebar -->
      <div style="width:170px;flex:none;display:flex;flex-direction:column;gap:2px">
        <div style="font:600 10px/1 'Instrument Sans';letter-spacing:.08em;color:#a9acb4;margin-bottom:8px">FOLDERS</div>
        <div style="display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:7px;background:#eef0f2;font:600 13px/1 'Instrument Sans';color:#131416">📁 All assets</div>
        <div style="display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:7px;font:500 13px/1 'Instrument Sans';color:#525660">📂 Summer</div>
        <div style="display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:7px;font:500 13px/1 'Instrument Sans';color:#525660">📂 Branding</div>
        <div style="display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:7px;font:500 13px/1 'Instrument Sans';color:#525660">📂 Client gifts</div>
        <div style="display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:7px;font:500 13px/1 'Instrument Sans';color:#597eff;margin-top:6px">+ New folder</div>
      </div>

      <!-- Main -->
      <div style="flex:1;min-width:0">
        <div style="display:flex;gap:22px;border-bottom:1px solid #eeeff1;margin-bottom:18px">
          <span style="font:600 13px/1 'Instrument Sans';color:#131416;padding-bottom:11px;box-shadow:inset 0 -2px 0 #131416">All</span>
          <span style="font:500 13px/1 'Instrument Sans';color:#868a98;padding-bottom:11px">Images</span>
          <span style="font:500 13px/1 'Instrument Sans';color:#868a98;padding-bottom:11px">Files</span>
        </div>

        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px">
          <div style="aspect-ratio:1;border-radius:8px;background:#5b6ee1;position:relative"></div>
          <div style="aspect-ratio:1;border-radius:8px;background:#e8c4d8;position:relative"></div>
          <div style="aspect-ratio:1;border-radius:8px;background:#131416;position:relative;box-shadow:0 0 0 2px #597eff,0 0 0 4px #fff"><span style="position:absolute;top:6px;left:6px;width:18px;height:18px;border-radius:50%;background:#597eff;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center">✓</span></div>
          <div style="aspect-ratio:1;border-radius:8px;background:#f4d9a8;position:relative"></div>
          <div style="aspect-ratio:1;border-radius:8px;background:#a8d4c8;position:relative"></div>
          <div style="aspect-ratio:1;border-radius:8px;background:#cfd2d8;position:relative;display:flex;align-items:center;justify-content:center;font-size:20px;color:#868a98">📄</div>
          <div style="aspect-ratio:1;border-radius:8px;background:#dfe6ee;position:relative"></div>
          <div style="aspect-ratio:1;border-radius:8px;background:#e3ccb8;position:relative"></div>
        </div>

        <!-- selection toolbar -->
        <div style="position:relative;margin-top:20px">
          <div style="display:inline-flex;align-items:center;gap:14px;background:#131416;border-radius:10px;padding:10px 16px;box-shadow:0 8px 20px rgba(0,18,71,.2)">
            <span style="font:600 12.5px/1 'Instrument Sans';color:#fff">1 selected</span>
            <span style="width:1px;height:16px;background:#3a3c42"></span>
            <span style="font:500 12.5px/1 'Instrument Sans';color:#d7d9dc;display:flex;align-items:center;gap:6px">⤓ Download</span>
            <span style="font:500 12.5px/1 'Instrument Sans';color:#d7d9dc;display:flex;align-items:center;gap:6px">📁 Move to folder</span>
            <span style="font:500 12.5px/1 'Instrument Sans';color:#d7d9dc;display:flex;align-items:center;gap:6px">✕ Remove from folder</span>
            <span style="font:500 12.5px/1 'Instrument Sans';color:#f0a3a3;display:flex;align-items:center;gap:6px">🗑 Delete</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1000,&quot;height&quot;:640}}"></script>
</body>
</html>
