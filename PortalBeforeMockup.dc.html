<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</helmet>
<div style="width:900px;height:600px;position:relative;background:#fff;font-family:'Instrument Sans',system-ui,sans-serif;overflow:hidden;user-select:none">
  <div style="height:52px;border-bottom:1px solid #eeeff1;display:flex;align-items:center;justify-content:space-between;padding:0 22px">
    <div style="display:flex;align-items:center;gap:8px"><span style="width:20px;height:20px;border-radius:5px;background:#131416;display:inline-block"></span><span style="font:600 13px/1 'Instrument Sans';color:#2a2c31">All Projects</span></div>
    <span style="width:26px;height:26px;border-radius:50%;background:#e4e5e8;display:inline-block"></span>
  </div>
  <div style="padding:22px 40px 0">
    <div style="width:100%;height:200px;border-radius:8px;background:linear-gradient(180deg,#8b9992 0%,#4d5c56 55%,#313d38 100%);position:relative;overflow:hidden">
      <div style="position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 40px,rgba(0,0,0,.05) 40px 42px)"></div>
      <div style="position:absolute;left:20px;bottom:16px;color:#fff"><div style="font:700 20px/1.1 'Instrument Sans'">Project name</div><div style="font:400 12px/1.3 'Instrument Sans';opacity:.85;margin-top:4px">Sun, Sep 22, 2026</div></div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:14px">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font:400 12px/1 'Instrument Sans';color:#868a98">Visible to you + 1 participant</span>
      </div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px">
      <div style="display:flex;gap:16px">
        <span style="display:flex;align-items:center;gap:6px;font:500 12px/1 'Instrument Sans';color:#525660"><span style="width:22px;height:22px;border-radius:50%;background:#e4e5e8;display:inline-block"></span>You</span>
        <span style="display:flex;align-items:center;gap:6px;font:500 12px/1 'Instrument Sans';color:#525660"><span style="width:22px;height:22px;border-radius:50%;background:#d7c9be;display:inline-block"></span>Avia Eyal</span>
      </div>
      <span style="font:600 12px/1 'Instrument Sans';color:#525660;display:flex;align-items:center;gap:6px">⤒ UPLOAD</span>
    </div>
    <div style="display:flex;gap:26px;margin-top:20px;border-bottom:1px solid #eeeff1">
      <span style="font:600 13px/1 'Instrument Sans';color:#131416;padding-bottom:11px;box-shadow:inset 0 -2px 0 #131416">Activity</span>
      <span style="font:500 13px/1 'Instrument Sans';color:#868a98;padding-bottom:11px">Files</span>
      <span style="font:500 13px/1 'Instrument Sans';color:#868a98;padding-bottom:11px">Notes</span>
      <span style="font:500 13px/1 'Instrument Sans';color:#868a98;padding-bottom:11px">Details</span>
    </div>
    <div style="background:#fafbfb;border-radius:10px;margin-top:22px;padding:16px 20px">
      <div style="display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #eeeff1;border-radius:22px;padding:9px 14px"><span style="width:22px;height:22px;border-radius:50%;background:#d7c9be;display:inline-block"></span><span style="font:400 12.5px/1 'Instrument Sans';color:#a9acb4">Send to Avia</span></div>
      <div style="display:flex;align-items:center;gap:14px;margin-top:16px">
        <span style="width:26px;height:26px;border-radius:50%;background:#c7ecd8;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none">💬</span>
        <div style="flex:1"><div style="font:700 10.5px/1 'Instrument Sans';letter-spacing:.06em;color:#868a98;margin-bottom:6px">NEED RECOMMENDATIONS?</div><div style="font:400 12.5px/1.4 'Instrument Sans';color:#525660">Ask Avia Eyal for their vendor recommendations.</div>
          <div style="display:flex;gap:8px;margin-top:10px"><span style="font:600 11.5px/1 'Instrument Sans';color:#fff;background:#131416;padding:8px 16px;border-radius:6px">REQUEST</span><span style="font:600 11.5px/1 'Instrument Sans';color:#525660;border:1px solid #e4e5e8;padding:8px 16px;border-radius:6px">SKIP</span></div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:600}}"></script>
</body>
</html>
