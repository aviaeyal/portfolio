<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Illustration · Avia Eyal</title>
<meta name="description" content="Gouache and colored-pencil illustration work by Avia Eyal.">
<meta name="robots" content="noindex">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&amp;family=Hanken+Grotesk:ital,wght@0,400;0,500;1,400&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
  html{scroll-behavior:smooth;--ease:cubic-bezier(.16,1,.3,1)}
  body{margin:0;background:#fbfbf9;color:#121210;font-family:'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  ::selection{background:#12121012}
  a{color:inherit}
  .ilink{text-decoration:none;border-bottom:1px solid #12121033;padding-bottom:1px;transition:border-color .2s var(--ease)}
  .ilink:hover{border-bottom-color:#121210}
  .navlink{transition:color .2s var(--ease)}
  .navlink:hover{color:#121210}
  .pht{aspect-ratio:1;border-radius:8px;overflow:hidden;background:#f1f0ea;border:1px solid #14141216;display:flex;align-items:center;justify-content:center;cursor:zoom-in;transition:transform .2s var(--ease)}
  .pht:hover{transform:scale(1.02)}
  .pht:focus-visible{outline:2px solid #121210;outline-offset:2px}
  .pht picture{width:100%;height:100%;display:block}
  .pht img{width:100%;height:100%;object-fit:contain}
  .lb{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:#121210f2;padding:4vh 7vw}
  .lb.open{display:flex}
  .lb img{max-width:100%;max-height:min(800px,92vh);object-fit:contain;border-radius:8px}
  .lb-btn{position:absolute;background:#fbfbf91a;border:1px solid #fbfbf94d;color:#fbfbf9;width:46px;height:46px;border-radius:50%;font:400 22px/1 'Hanken Grotesk',system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s var(--ease)}
  .lb-btn:hover{background:#fbfbf933}
  .lb-btn:focus-visible{outline:2px solid #fbfbf9;outline-offset:2px}
  .lb-close{top:18px;right:18px;font-size:17px}
  .lb-prev{left:20px;top:50%;transform:translateY(-50%)}
  .lb-next{right:20px;top:50%;transform:translateY(-50%)}
  .lb-count{position:absolute;bottom:20px;left:0;right:0;text-align:center;font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#fbfbf9b3}
  @media (max-width:640px){.lb{padding:8vh 2vw}.lb-prev{left:8px}.lb-next{right:8px}}
  @keyframes lbfade{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion:no-preference){
    header{animation:reveal .6s var(--ease) both}
    .lb.open{animation:lbfade .2s var(--ease)}
  }
  @keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<nav style="position:sticky;top:0;z-index:50;background:#fbfbf9f2;backdrop-filter:blur(8px);border-bottom:1px solid #14141216;display:flex;align-items:center;justify-content:space-between;padding:0 34px;height:60px">
  <a href="../" style="font:600 15px/1 'Bricolage Grotesque',sans-serif;letter-spacing:-.01em;text-decoration:none;color:#121210">Avia Eyal</a>
  <div style="display:flex;gap:26px;align-items:center;font:500 12.5px/1 'Hanken Grotesk',sans-serif;color:#5f5f58">
    <a href="../" class="navlink" style="text-decoration:none">Work</a>
    <a href="../#about" class="navlink" style="text-decoration:none">About</a>
    <a href="../#contact" class="navlink" style="text-decoration:none">Contact</a>
  </div>
</nav>
<div style="max-width:640px;margin:0 auto;padding:0 28px">

  <header style="padding:84px 0 0">
    <h1 style="font-family:'Bricolage Grotesque',sans-serif;font-weight:500;font-size:26px;line-height:1;letter-spacing:-.02em;margin:0">Illustration</h1>
    <p style="font:400 16px/1.7 'Hanken Grotesk',sans-serif;color:#5f5f58;margin:14px 0 0;max-width:52ch">Gouache and colored pencil, drawn outside work.</p>
  </header>

  <section id="illustration" style="padding:44px 0 0">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px">
      <div class="pht"><picture><source srcset="../assets/illustrations/urban-plaza.webp" type="image/webp"><img src="../assets/illustrations/urban-plaza.jpg" loading="lazy" alt="Gouache illustration of a peach-toned courtyard with steps, purple trees, and cat-like creatures lounging in the evening light"></picture></div>
      <div class="pht"><picture><source srcset="../assets/illustrations/fish-window.webp" type="image/webp"><img src="../assets/illustrations/fish-window.jpg" loading="lazy" alt="Gouache illustration of a cat looking through a blue window at an oversized goldfish"></picture></div>
      <div class="pht"><picture><source srcset="../assets/illustrations/face-in-water.webp" type="image/webp"><img src="../assets/illustrations/face-in-water.jpg" loading="lazy" alt="Gouache illustration of a blue-haired face emerging from swirling orange water, surrounded by koi"></picture></div>
      <div class="pht"><picture><source srcset="../assets/illustrations/girl-in-cat.webp" type="image/webp"><img src="../assets/illustrations/girl-in-cat.jpg" loading="lazy" alt="Colored pencil illustration of a girl curled up asleep inside a giant striped cat"></picture></div>
      <div class="pht"><picture><source srcset="../assets/illustrations/urban-market.webp" type="image/webp"><img src="../assets/illustrations/urban-market.jpg" loading="lazy" alt="Gouache illustration of a lantern-lit night market stall with a long-legged fish creature and fruit baskets"></picture></div>
      <div class="pht"><picture><source srcset="../assets/illustrations/urban-bus.webp" type="image/webp"><img src="../assets/illustrations/urban-bus.jpg" loading="lazy" alt="Gouache illustration of animal-headed passengers riding a city bus at sunset"></picture></div>
      <div class="pht"><picture><source srcset="../assets/illustrations/waterfall-room.webp" type="image/webp"><img src="../assets/illustrations/waterfall-room.jpg" loading="lazy" alt="Gouache illustration of a bedroom where the bed has become a mossy waterfall, with a fox-eared figure resting in it"></picture></div>
      <div class="pht"><picture><source srcset="../assets/illustrations/floor-with-plants.webp" type="image/webp"><img src="../assets/illustrations/floor-with-plants.jpg" loading="lazy" alt="Gouache illustration of a person lying on a tiled floor surrounded by houseplants, a laptop, and a cat"></picture></div>
    </div>
    <p style="font:400 14px/1.6 'Hanken Grotesk',sans-serif;color:#8a8a82;margin:18px 0 0">More on <a href="https://instagram.com/aviaeyal" target="_blank" rel="noopener" class="ilink">@aviaeyal ↗</a></p>
  </section>

  <footer style="padding:48px 0 40px;display:flex;justify-content:center;font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.04em;color:#717684">
    <span>© Avia Eyal 2026 | Tel Aviv</span>
  </footer>
</div>
<script>
(function () {
  var SEL = '#illustration .pht';
  var lb, lbImg, lbCount, items = [], idx = 0, lastFocus = null;

  function collect() {
    items = Array.prototype.map.call(document.querySelectorAll(SEL), function (tile) {
      var im = tile.querySelector('img');
      return { src: (im && (im.currentSrc || im.getAttribute('src'))) || '', alt: (im && im.getAttribute('alt')) || 'Illustration' };
    });
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function build() {
    lb = document.createElement('div');
    lb.className = 'lb';
    lb.setAttribute('role', 'dialog');
    lb.setAttribute('aria-modal', 'true');
    lb.setAttribute('aria-label', 'Illustration viewer');
    lb.innerHTML =
      '<button type="button" class="lb-btn lb-close" aria-label="Close viewer">✕</button>' +
      '<button type="button" class="lb-btn lb-prev" aria-label="Previous illustration">‹</button>' +
      '<button type="button" class="lb-btn lb-next" aria-label="Next illustration">›</button>' +
      '<div class="lb-count" aria-hidden="true"></div>';
    lbImg = document.createElement('img');
    lbImg.alt = '';
    lb.appendChild(lbImg);
    document.body.appendChild(lb);
    lbCount = lb.querySelector('.lb-count');
    lb.querySelector('.lb-close').addEventListener('click', close);
    lb.querySelector('.lb-prev').addEventListener('click', function (e) { e.stopPropagation(); go(-1); });
    lb.querySelector('.lb-next').addEventListener('click', function (e) { e.stopPropagation(); go(1); });
    lb.addEventListener('click', function (e) { if (e.target === lb) close(); });
  }
  function show() {
    var it = items[idx];
    lbImg.setAttribute('src', it.src);
    lbImg.setAttribute('alt', it.alt);
    lbCount.textContent = pad(idx + 1) + ' / ' + pad(items.length);
  }
  function open(i) {
    collect();
    if (!items.length) return;
    if (!lb) build();
    idx = i; lastFocus = document.activeElement;
    show();
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
    lb.querySelector('.lb-close').focus();
    document.addEventListener('keydown', onKey);
  }
  function close() {
    if (!lb) return;
    lb.classList.remove('open');
    document.body.style.overflow = '';
    document.removeEventListener('keydown', onKey);
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  function go(d) { idx = (idx + d + items.length) % items.length; show(); }
  function onKey(e) {
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowRight') go(1);
    else if (e.key === 'ArrowLeft') go(-1);
  }
  function tileIndex(tile) {
    var all = document.querySelectorAll(SEL);
    for (var i = 0; i < all.length; i++) if (all[i] === tile) return i;
    return 0;
  }
  function enhance() {
    Array.prototype.forEach.call(document.querySelectorAll(SEL), function (t) {
      if (t.dataset.lbReady) return;
      t.dataset.lbReady = '1';
      t.setAttribute('role', 'button');
      t.setAttribute('tabindex', '0');
      var im = t.querySelector('img');
      t.setAttribute('aria-label', 'View illustration' + (im && im.alt ? ': ' + im.alt : '') + ' (opens larger)');
    });
  }
  document.addEventListener('click', function (e) {
    var tile = e.target.closest && e.target.closest(SEL);
    if (tile) { e.preventDefault(); open(tileIndex(tile)); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
    var tile = e.target.closest && e.target.closest(SEL);
    if (tile) { e.preventDefault(); open(tileIndex(tile)); }
  });
  function ready(fn) { if (document.readyState !== 'loading') fn(); else document.addEventListener('DOMContentLoaded', fn); }
  ready(function () {
    enhance();
    var obs = new MutationObserver(enhance);
    obs.observe(document.body, { childList: true, subtree: true });
    setTimeout(function () { obs.disconnect(); }, 4000);
  });
})();
</script>
</body>
</html>
